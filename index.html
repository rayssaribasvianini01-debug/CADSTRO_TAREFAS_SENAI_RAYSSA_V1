<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Painel de Tarefas</title>
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="cartao-aplicacao">
    
   
    <header class="cabecalho-aplicacao">
      <div class="topo-cabecalho">
        <h1>Minhas Tarefas</h1>
        <div class="acoes-topo">
          <div class="foto-perfil"></div>
          <button id="botao-alterar-tema"><i class="fa-solid fa-moon"></i></button>
        </div>
      </div>
      <p class="subtitulo-editorial">cultive bons hábitos, um dia de cada vez</p>
    
    <div class="caixa-entrada">
      <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje?..." maxlength="40">
      <button class="botao-principal" id="botao-adicionar">
        <i class="fa-solid fa-plus"></i> Adicionar
      </button>
    </div>

    <!-- Filtros -->
    <div class="filtros">
      <button class="filtro-btn ativo">Todas</button>
      <button class="filtro-btn">Pendentes</button>
      <button class="filtro-btn">Concluídas</button>
    </div>

    
    <ul class="lista-tarefas" id="lista-tarefas"></ul>

   
    <footer class="rodape-aplicacao">
      <span id="contador-tarefas">0 tarefas na lista</span>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
