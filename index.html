<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Tarefas</title>

    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" &gt>
</head>

<body>
    <div class="cartao-aplicacao">

        <header class="cabecalio-aplicacao">
            <h1>Minhas Tarefas</h1>
            <button class="botao-icone" id="botao-alterar-tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <div class="caixa-entrada">
            <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje?..." maxlength="40">
            <button class="botao-principal" id="botao-adicionar">
                <i class="fa-solid fa-plus"></i>Adicionar
            </button>
        </div>

        <ul class="lista-tarefas" id="lista-tarefas">
            <!-- As tarefas serâo inseridas dinâmicamente via javascript -->
        </ul>
        <footer class="radape-aplicacao">
            <span id="contador-tarefas">0 tarefas na lista</span>
            <div class="filtros">
         <button class="filtro-btn ativo">Todas</button>
         <button class="filtro-btn">Pendentes</button>
         <button class="filtro-btn">Concluídas</button>
</div>
        </footer>

    </div>


    <script src="script.js"></script>
</body>

</html>
